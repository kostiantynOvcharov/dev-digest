# Harness evals — WORKFLOW tier (systemic behaviour of the LIVE harness).
#
# Fires when anything that shapes the assembled harness changes: the agent guide (CLAUDE.md is a
# symlink to AGENTS.md — watch both), any subagent definition, the workflow cases, or the eval
# engine. Runs the whole workflow tier (skill activation, subagent dispatch, CLAUDE.md routing).
# There is nothing to "skip" here — the workflow cases always exist.
#
# MODEL: anthropic/claude-haiku-4.5. This tier asserts behaviour-shaped traces (the model must
# INVOKE the Skill tool, HOP between docs, DISPATCH a subagent). Cheap non-Anthropic models are
# "indicative, not blocking" here — on Gemini/DeepSeek the model tends to do the work inline
# instead, so the tier is flaky (measured 2/4). Haiku is 4/4 green, so this stays a blocking gate.
#
# NO PROXY: anthropic/* slugs are served natively by OpenRouter's Anthropic Skin, so the Agent SDK
# talks to https://openrouter.ai/api directly (env.ts default) — no LiteLLM translating proxy. If
# you switch EVAL_MODEL to a non-Anthropic slug you must re-add the proxy (see eval-agents.yml).
name: eval-workflow

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/agents/**'
      - 'evals/workflow/**'
      - 'evals/src/**'
      - '.github/workflows/eval-workflow.yml'
  workflow_dispatch:
    inputs:
      eval_model:
        description: 'Model under test (Anthropic OpenRouter slug — non-Anthropic slugs need the proxy)'
        default: 'anthropic/claude-haiku-4.5'
      judge_model:
        description: 'Judge model (OpenRouter slug)'
        default: 'anthropic/claude-haiku-4.5'

permissions:
  contents: read

concurrency:
  group: eval-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      # No OPENROUTER_BASE_URL: anthropic/* is served natively by the OpenRouter Anthropic Skin.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.eval_model || 'anthropic/claude-haiku-4.5' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || 'anthropic/claude-haiku-4.5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Run workflow evals
        # Sequential + one retry to smooth any transient OpenRouter hiccup on the tool tier.
        run: pnpm eval:workflow --retry=1 --no-file-parallelism
